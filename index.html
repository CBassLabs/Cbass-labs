<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d12"><link rel="manifest" href="manifest.webmanifest"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>C-Bass Labs</title><style>body{margin:0;background:#090d12;color:#fff;font-family:system-ui,-apple-system,sans-serif}.app{max-width:620px;margin:auto;padding:16px 12px 100px}.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.logo{width:42px;height:42px;border:1px solid #d6a640;border-radius:12px;display:grid;place-items:center;color:#e2b957;font-weight:900}h1{font-size:21px;color:#e2b957;margin:0}.sub{font-size:10px;color:#aeb7c2}.tabs,.row,.quick{display:flex;gap:6px}.tabs{margin:10px 0}.tabs button,.btn,.quick button{border:1px solid #303b49;background:#151c24;color:#fff;border-radius:10px;padding:10px;font-weight:800}.tabs button.on,.gold{background:#d6a640!important;color:#111!important}.card{background:#12171e;border:1px solid #2b313a;border-radius:14px;padding:12px;margin:8px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric b{font-size:22px}.muted{color:#9aa5b2;font-size:11px}.wide{width:100%}.sets{margin-top:8px;border-top:1px solid #2b313a;padding-top:8px}.set{display:grid;grid-template-columns:1fr 1fr 58px;gap:6px;margin:6px 0}.ctl{display:grid;grid-template-columns:34px 1fr 34px;gap:3px}.ctl button,.done{border:1px solid #303b49;background:#202936;color:#fff;border-radius:8px;min-height:40px;font-weight:900}.val{display:grid;place-items:center;background:#151c24;border-radius:8px;font-size:12px}.done.yes{background:#39c66d;color:#07140b}.timer{font-size:24px;font-weight:900}.hidden{display:none}.progress{height:6px;background:#05070a;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:#d6a640}.date input,.date select{width:100%;box-sizing:border-box;background:#202936;color:#fff;border:1px solid #303b49;border-radius:9px;padding:10px;margin-top:4px;color-scheme:dark}.finish{background:#39c66d!important;color:#07140b!important}</style></head><body><div class="app"><div class="top"><div class="logo">CB</div><div><h1>C-BASS LABS</h1><div class="sub">STRENGTH · TRACKING · PROGRESS</div></div></div><div class="tabs"><button id="tabTrain" class="on">Train</button><button id="tabHistory">History</button><button id="tabProgress">Progress</button></div><section id="train"><div class="card date"><div class="grid"><div><div class="muted">DATE</div><input id="date" type="date"></div><div><div class="muted">WORKOUT</div><select id="type"></select></div></div></div><div class="grid"><div class="card metric"><div class="muted">PROTEIN</div><b><span id="protein">0</span>g</b><div class="quick"><button data-p="10">+10</button><button data-p="25">+25</button></div></div><div class="card metric"><div class="muted">WATER</div><b><span id="water">0</span>oz</b><div class="quick"><button data-w="8">+8</button><button data-w="16">+16</button></div></div></div><div class="card"><div class="row"><div style="flex:1"><div class="muted">WORKOUT TIMER</div><div id="workTimer" class="timer">0:00</div></div><button id="startWorkout" class="btn gold">Start</button></div></div><div class="card"><div class="row"><div style="flex:1"><div class="muted">REST TIMER</div><div id="restTimer" class="timer">0:00</div></div><button id="restStart" class="btn">Start</button><button id="restStop" class="btn">Stop</button><button id="restReset" class="btn">Reset</button></div></div><div id="summary" class="card"></div><div id="workout"></div><button id="finish" class="btn finish wide">Finish Workout</button></section><section id="history" class="hidden"><div class="card"><h2>History</h2><div id="historyList" class="muted"></div></div></section><section id="progressView" class="hidden"><div class="card"><h2>Progress</h2><div id="progressList"></div></div></section></div><script>
'use strict';
const BASE=[['Chest',[['Barbell Bench Press',3,8,135,5],['Incline Chest Press Machine',3,10,90,5],['Pec Deck',3,12,80,5],['Push-Ups',2,15,'BW',0]]],['Back',[['Pull-Ups',3,6,'BW',0],['Lat Pulldown',3,10,100,5],['Chest-Supported Row',3,10,100,5],['Seated Row Machine',3,10,100,5]]],['Legs',[['Barbell Back Squat',3,8,155,5],['Leg Press',3,10,200,10],['Seated Leg Curl',3,12,80,5],['Leg Extension',3,12,80,5],['Calf Raise Machine',3,12,130,10]]],['Shoulders',[['Shoulder Press Machine',3,10,70,5],['Lateral Raise Machine',3,12,40,5],['Reverse Pec Deck',3,12,60,5]]],['Triceps',[['Bodyweight Dips',3,10,'BW',0],['Triceps Pressdown',3,12,50,5],['Overhead Cable Triceps Extension',3,12,40,5]]],['Biceps',[['Cable Biceps Curl',3,12,40,5],['Dumbbell Curl',3,12,20,5]]],['Core',[['Plank',3,45,'BW',0],['Ab Crunch Machine',3,15,70,5],['Hanging Knee Raise',3,10,'BW',0]]],['Bodyweight',[['Push-Ups',3,15,'BW',0],['Pull-Ups',3,6,'BW',0],['Bodyweight Dips',3,10,'BW',0],['Air Squats',3,20,'BW',0]]],['Cardio',[['Incline Treadmill Walk',1,30,0,1]]]];
const KEY='cbass_simple_v1'; const today=()=>{let d=new Date(),m=String(d.getMonth()+1).padStart(2,'0'),x=String(d.getDate()).padStart(2,'0');return d.getFullYear()+'-'+m+'-'+x}; let st=JSON.parse(localStorage.getItem(KEY)||'null')||{date:today(),type:0,days:{},history:[]}; let workoutStart=0,restStart=0,restElapsed=0,restRunning=false;
const $=id=>document.getElementById(id); const save=()=>localStorage.setItem(KEY,JSON.stringify(st)); function day(){if(!st.days[st.date])st.days[st.date]={protein:0,water:0,sets:{}};return st.days[st.date]} function fmt(s){s=Math.max(0,s|0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function render(){ $('date').value=st.date; $('type').innerHTML=BASE.map((x,i)=>'<option value="'+i+'">'+x[0]+'</option>').join(''); $('type').value=st.type; let d=day(); $('protein').textContent=d.protein||0; $('water').textContent=d.water||0; let ex=BASE[st.type][1],done=0,total=0,html=''; ex.forEach((x,e)=>{total+=x[1];html+='<div class="card"><b>'+x[0]+'</b><div class="muted">'+x[1]+' sets · target '+x[2]+'</div><div class="sets">';for(let s=0;s<x[1];s++){let k=e+'_'+s,z=d.sets[k]||(d.sets[k]={w:x[3],r:x[2],done:false});if(z.done)done++;html+='<div class="set"><div><div class="muted">WEIGHT</div><div class="ctl"><button data-a="weight" data-e="'+e+'" data-s="'+s+'" data-d="-'+x[4]+'">−</button><div class="val">'+(z.w==='BW'?'BW':z.w+' lb')+'</div><button data-a="weight" data-e="'+e+'" data-s="'+s+'" data-d="'+x[4]+'">+</button></div></div><div><div class="muted">REPS</div><div class="ctl"><button data-a="reps" data-e="'+e+'" data-s="'+s+'" data-d="-1">−</button><div class="val">'+z.r+'</div><button data-a="reps" data-e="'+e+'" data-s="'+s+'" data-d="1">+</button></div></div><button class="done '+(z.done?'yes':'')+'" data-a="done" data-e="'+e+'" data-s="'+s+'">'+(z.done?'✓':'TAP')+'</button></div>'}html+='</div></div>'});$('workout').innerHTML=html;$('summary').innerHTML='<b>'+BASE[st.type][0]+'</b><div class="muted">'+done+' / '+total+' sets complete</div><div class="progress"><i style="width:'+(total?done/total*100:0)+'%"></i></div>';save()}
function show(which){$('train').classList.toggle('hidden',which!=='train');$('history').classList.toggle('hidden',which!=='history');$('progressView').classList.toggle('hidden',which!=='progress');$('tabTrain').classList.toggle('on',which==='train');$('tabHistory').classList.toggle('on',which==='history');$('tabProgress').classList.toggle('on',which==='progress');if(which==='history')renderHistory();if(which==='progress')renderProgress()}
$('tabTrain').onclick=()=>show('train');$('tabHistory').onclick=()=>show('history');$('tabProgress').onclick=()=>show('progress');$('date').onchange=e=>{st.date=e.target.value;render()};$('type').onchange=e=>{st.type=Number(e.target.value);render()};document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.p){day().protein+=Number(b.dataset.p);render();return}if(b.dataset.w){day().water+=Number(b.dataset.w);render();return}if(!b.dataset.a)return;let ex=BASE[st.type][1][Number(b.dataset.e)],k=b.dataset.e+'_'+b.dataset.s,z=day().sets[k]||(day().sets[k]={w:ex[3],r:ex[2],done:false});if(b.dataset.a==='done')z.done=!z.done;if(b.dataset.a==='reps')z.r=Math.max(1,z.r+Number(b.dataset.d));if(b.dataset.a==='weight'&&z.w!=='BW')z.w=Math.max(0,z.w+Number(b.dataset.d));if(navigator.vibrate)navigator.vibrate(20);render()});
$('startWorkout').onclick=()=>{workoutStart=Date.now();$('startWorkout').textContent='Running'};$('restStart').onclick=()=>{if(!restRunning){restRunning=true;restStart=Date.now()}};$('restStop').onclick=()=>{if(restRunning){restElapsed+=Math.floor((Date.now()-restStart)/1000);restRunning=false}};$('restReset').onclick=()=>{restElapsed=0;restRunning=false;$('restTimer').textContent='0:00'};$('finish').onclick=()=>{let d=day(),done=Object.values(d.sets).filter(x=>x.done).length;st.history.push({date:st.date,type:BASE[st.type][0],sets:done});save();alert('Workout saved');renderHistory()};setInterval(()=>{if(workoutStart)$('workTimer').textContent=fmt((Date.now()-workoutStart)/1000);$('restTimer').textContent=fmt(restElapsed+(restRunning?(Date.now()-restStart)/1000:0))},500);
function renderHistory(){$('historyList').innerHTML=st.history.length?st.history.slice().reverse().map(x=>'<div class="card"><b>'+x.date+' · '+x.type+'</b><div class="muted">'+x.sets+' sets completed</div></div>').join(''):'No workouts saved yet.'}function renderProgress(){let total=st.history.reduce((a,x)=>a+x.sets,0);$('progressList').innerHTML='<div class="grid"><div class="card metric"><div class="muted">WORKOUTS</div><b>'+st.history.length+'</b></div><div class="card metric"><div class="muted">SETS</div><b>'+total+'</b></div></div>'}render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
