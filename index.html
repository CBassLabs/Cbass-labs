function save(){localStorage.setItem(KEY,JSON.stringify(st))}function haptic(p=25){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}function toast(t){let e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1400)}function daily(date=st.selectedDate){if(!st.daily[date])st.daily[date]={protein:0,water:0,weight:null};return st.daily[date]}function addDaily(type,amt){let d=daily();d[type]=Math.max(0,Number(d[type]||0)+amt);save();haptic(18);renderDaily()}function editDaily(type){let d=daily(),label=type==="weight"?"Body weight (lb)":type==="protein"?"Protein today (g)":"Water today (oz)",cur=d[type]??"",v=prompt(label,cur);if(v===null)return;v=Number(v);if(!Number.isFinite(v)||v<0){toast("Enter a valid number");return}d[type]=v;save();haptic(25);renderDaily();if(type==="weight")renderDashboard()}function previousWeight(){let dates=Object.keys(st.daily).filter(x=>x<st.selectedDate&&st.daily[x]?.weight!=null).sort().reverse();return dates.length?Number(st.daily[dates[0]].weight):null}function renderDaily(){let d=daily(),p=Number(d.protein||0),w=Number(d.water||0),wt=d.weight==null?null:Number(d.weight),prev=previousWeight();dailyDate.textContent=st.selectedDate===localISO()?"TODAY":st.selectedDate;proteinVal.textContent=Math.round(p);waterVal.textContent=Math.round(w);proteinBar.style.width=Math.min(100,p/180*100)+"%";waterBar.style.width=Math.min(100,w/100*100)+"%";weightVal.textContent=wt==null?"—":wt.toFixed(1);weightUnit.style.display=wt==null?"none":"inline";weightTrend.textContent=wt==null?"Log weight under similar conditions.":prev==null?"First logged weight.":`${wt-prev>=0?"+":""}${(wt-prev).toFixed(1)} lb vs previous log`}

function session(){let s=st.sessions[st.selectedDate];if(!s){s={workout:active,sets:{},custom:[],extraSets:{},started:null,finished:null};st.sessions[st.selectedDate]=s}else{if(!s.custom)s.custom=[];if(!s.sets)s.sets={};if(!s.extraSets)s.extraSets={}}return s}function exercises(){let s=session();return BASE[active].ex.concat(s.custom)}function setCount(e,x){return x[1]+Number(session().extraSets[e]||0)}function addSet(e){let s=session();s.extraSets[e]=Number(s.extraSets[e]||0)+1;save();haptic(30);render()}function removeSet(e){let x=exercises()[e],s=session(),n=Number(s.extraSets[e]||0);if(n<=0){toast("Keeping the programmed sets");return}let last=x[1]+n-1;delete s.sets[`${e}_${last}`];s.extraSets[e]=n-1;save();haptic(25);render()}function setData(e,s,x){let k=`${e}_${s}`,ss=session();if(!ss.sets[k])ss.sets[k]={weight:x[3],reps:x[2],done:false};return ss.sets[k]}function fmt(sec){sec=Math.max(0,sec|0);return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`}function elapsed(){let s=session();return s.started?Math.floor(((s.finished||Date.now())-s.started)/1000):0}function startWorkout(){let s=session();s.started=Date.now();s.finished=null;save();haptic(45);render();startClock()}function changeDate(v){st.selectedDate=v;active=st.sessions[v]?.workout??0;save();render()}function changeWorkout(v){active=Number(v);let s=session();s.workout=active;s.sets={};s.extraSets={};save();haptic(25);render()}let clockLoop=null;function startClock(){if(clockLoop)return;clockLoop=setInterval(()=>{let c=document.getElementById("clock");if(c)c.textContent=fmt(elapsed())},1000)}
function prevSet(name,s){let dates=Object.keys(st.sessions).filter(d=>d<st.selectedDate).sort().reverse();for(let d of dates){let ss=st.sessions[d], ex=BASE[ss.workout]?.ex.concat(ss.custom||[])||[];let ei=ex.findIndex(x=>x[0]===name);if(ei>=0){let z=ss.sets?.[`${ei}_${s}`];if(z?.done)return z}}return null}function bestFor(name){let best=null;Object.values(st.sessions).forEach(ss=>{let ex=BASE[ss.workout]?.ex.concat(ss.custom||[])||[];ex.forEach((x,e)=>{if(x[0]===name)for(let s=0;s<x[1];s++){let z=ss.sets?.[`${e}_${s}`];if(z?.done&&z.weight!=="BW"&&(!best||Number(z.weight)>Number(best.weight)||(Number(z.weight)===Number(best.weight)&&z.reps>best.reps)))best=z}})});return best}function suggest(name,s,x){let p=prevSet(name,s);if(!p)return null;if(p.weight==="BW")return `Beat ${p.reps} reps`;let add=(p.reps>=x[2])?x[4]:0;return `${Number(p.weight)+add} lb × ${x[2]}`}function changeVal(e,s,type,d){let x=exercises()[e],z=setData(e,s,x);if(type==="weight"&&z.weight!=="BW")z.weight=Math.max(0,Number(z.weight)+d);if(type==="reps")z.reps=Math.max(1,Number(z.reps)+d);save();haptic(18);render()}function toggle(e,s){let x=exercises()[e],z=setData(e,s,x);z.done=!z.done;if(z.done&&!session().started)session().started=Date.now();save();if(z.done){haptic([45,30,45]);resetRest();let b=bestBefore(x[0],st.selectedDate);if(z.weight!=="BW"&&(!b||Number(z.weight)>Number(b.weight)||(Number(z.weight)===Number(b.weight)&&z.reps>b.reps))){haptic([60,40,60,40,80]);toast("🏆 New PR — "+x[0])}}render();startClock()}function bestBefore(name,date){let best=null;Object.entries(st.sessions).filter(([d])=>d<date).forEach(([d,ss])=>{let ex=BASE[ss.workout]?.ex.concat(ss.custom||[])||[];ex.forEach((x,e)=>{if(x[0]===name)for(let s=0;s<x[1];s++){let z=ss.sets?.[`${e}_${s}`];if(z?.done&&z.weight!=="BW"&&(!best||Number(z.weight)>Number(best.weight)||(Number(z.weight)===Number(best.weight)&&z.reps>best.reps)))best=z}})});return best}function moveEx(i,d){let ss=session(), baseN=BASE[active].ex.length;if(i<baseN){toast("Preset exercises stay in place");return}let ci=i-baseN,j=ci+d;if(j<0||j>=ss.custom.length)return;[ss.custom[ci],ss.custom[j]]=[ss.custom[j],ss.custom[ci]];save();render()}function deleteEx(i){let baseN=BASE[active].ex.length;if(i<baseN){toast("Preset exercise can't be deleted");return}session().custom.splice(i-baseN,1);save();render()}function finishWorkout(){let ss=session();if(!ss.started)ss.started=Date.now();ss.finished=Date.now();save();haptic([70,40,70]);toast("Workout saved");render()}function startRest(){if(restRunning)return;restRunning=true;restStarted=Date.now();haptic(35)}function stopRest(){if(!restRunning)return;restElapsed+=Math.floor((Date.now()-restStarted)/1000);restRunning=false;haptic(45);drawRest()}function resetRest(){restElapsed=0;restStarted=0;restRunning=false;haptic([20,20,20]);drawRest()}function drawRest(){let s=restElapsed+(restRunning?Math.floor((Date.now()-restStarted)/1000):0),t=document.getElementById("timerText");if(t)t.textContent=fmt(s)}setInterval(drawRest,250);function openLibrary(){document.getElementById("libraryModal").classList.add("open");renderLibrary()}function closeLibrary(){document.getElementById("libraryModal").classList.remove("open")}function renderLibrary(){chips.innerHTML=Object.keys(LIB).map(c=>`<button class="chip ${c===libCat?"on":""}" onclick="libCat='${c}';renderLibrary()">${c}</button>`).join("");libraryList.innerHTML=LIB[libCat].map((x,i)=>`<div class="libitem"><div><b>${x[0]}</b><div class="small">${x[1]} sets · ${x[2]} reps</div></div><button class="primary" onclick="addLibrary('${libCat}',${i})">Add</button></div>`).join("")}function addLibrary(c,i){let x=LIB[c][i].slice();x.push(c);session().custom.push(x);save();haptic(30);closeLibrary();render()}function showView(v){["train","history","progress"].forEach(x=>{document.getElementById(x+"View").classList.toggle("hidden",x!==v);document.getElementById("t"+x[0].toUpperCase()+x.slice(1)).classList.toggle("on",x===v)});if(v==="history")renderHistory();if(v==="progress")renderDashboard()}function renderHistory(){let dates=Object.keys(st.sessions).sort().reverse();history.innerHTML=dates.length?dates.map(d=>{let ss=st.sessions[d],ex=BASE[ss.workout]?.ex.concat(ss.custom||[])||[],done=Object.values(ss.sets||{}).filter(x=>x.done).length,total=ex.reduce((a,x,e)=>a+x[1]+Number(ss.extraSets?.[e]||0),0),mins=ss.started?Math.round(((ss.finished||ss.started)-ss.started)/60000):0;return `<div class="histitem" onclick="st.selectedDate='${d}';active=${ss.workout};save();showView('train');render()"><div><b>${d}</b><div class="small">${BASE[ss.workout]?.title||"Workout"} · ${done}/${total} sets</div></div><b>${mins?mins+" min":"—"}</b></div>`}).join(""):'<div class="small">Finish a workout and it will appear here.</div>'}function renderDashboard(){let sessions=Object.entries(st.sessions).filter(([d,s])=>Object.values(s.sets||{}).some(x=>x.done)),totalSets=sessions.reduce((a,[d,s])=>a+Object.values(s.sets||{}).filter(x=>x.done).length,0);let names=["Barbell Bench Press","Barbell Back Squat","Pull-Ups"];let metrics=names.map(n=>{let b=bestFor(n);return `<div class="metric"><span class="small">${n}</span><b>${b?(b.weight==="BW"?"BW × "+b.reps:b.weight+" × "+b.reps):"—"}</b></div>`}).join("");let ds=Object.values(st.daily||{}),weights=ds.filter(x=>x.weight!=null).map(x=>Number(x.weight)),proteinDays=ds.filter(x=>Number(x.protein||0)>=180).length,waterDays=ds.filter(x=>Number(x.water||0)>=100).length;dashboard.innerHTML=`<div class="dashgrid"><div class="metric"><span class="small">Workouts logged</span><b>${sessions.length}</b></div><div class="metric"><span class="small">Sets completed</span><b>${totalSets}</b></div><div class="metric"><span class="small">Latest weight</span><b>${weights.length?weights[weights.length-1].toFixed(1)+" lb":"—"}</b></div><div class="metric"><span class="small">Protein target days</span><b>${proteinDays}</b></div><div class="metric"><span class="small">Water target days</span><b>${waterDays}</b></div>${metrics}</div><div class="small" style="margin-top:12px">Progression suggestion: when you complete the target reps cleanly, C-Bass Labs suggests the next weight increment for that set.</div>`}function render(){workoutChoice.innerHTML=BASE.map((x,i)=>`<option value="${i}">${x.title}</option>`).join("");workoutChoice.value=active;workoutDate.value=st.selectedDate;let ss=session(),ex=exercises(),total=ex.reduce((a,x,e)=>a+setCount(e,x),0),dn=0;ex.forEach((x,e)=>{for(let s=0;s<setCount(e,x);s++)if(setData(e,s,x).done)dn++});done.textContent=dn;percent.textContent=total?Math.round(dn/total*100)+"%":"—";clock.textContent=fmt(elapsed());homeHero.innerHTML=`<div class="small">${st.selectedDate===localISO()?"TODAY":st.selectedDate}</div><h2>${BASE[active].title}</h2><div class="row"><div class="grow small">${ss.finished?"Completed":ss.started?"Workout in progress":"Ready when you are"}</div>${!ss.started||ss.finished?`<button class="primary" onclick="startWorkout()">${ss.finished?"Restart":"Start Workout"}</button>`:""}</div>`;workout.innerHTML=`<div class="summary"><b>${BASE[active].title}</b><div class="small">${dn}/${total||0} working sets</div><div class="progress"><i style="width:${total?dn/total*100:0}%"></i></div></div>`+ex.map((x,e)=>{let [name,sets,rp,wt,step,rest]=x;let displaySets=setCount(e,x),best=bestFor(name);return `<div class="card"><div class="exerciseHead"><div><div class="name">${name}</div><div class="target">${displaySets} sets · target ${rp} · rest ${rest}s ${best?`· <span class="pr">PR ${best.weight==="BW"?"BW":best.weight+" lb"} × ${best.reps}</span>`:""}</div></div><div class="setAdjust"><button onclick="removeSet(${e})">−</button><span>${displaySets}</span><button onclick="addSet(${e})">＋</button></div></div>`+Array.from({length:displaySets},(_,s)=>{let z=setData(e,s,x),p=prevSet(name,s),sg=suggest(name,s,x);return `<div class="setblock"><div class="setlabel">SET ${s+1}</div>${p?`<div class="previous">Last: ${p.weight==="BW"?"BW":p.weight+" lb"} × ${p.reps}</div>`:""}${sg?`<div class="suggest">Suggested: ${sg}</div>`:""}<div class="setcontrols"><div><span class="tiny">WEIGHT</span><div class="controls"><button ${z.weight==="BW"?"disabled":""} onclick="changeVal(${e},${s},'weight',-${step})">−</button><div class="value">${z.weight==="BW"?"BW":z.weight+" lb"}</div><button ${z.weight==="BW"?"disabled":""} onclick="changeVal(${e},${s},'weight',${step})">+</button></div></div><div><span class="tiny">REPS</span><div class="controls"><button onclick="changeVal(${e},${s},'reps',-1)">−</button><div class="value">${z.reps}</div><button onclick="changeVal(${e},${s},'reps',1)">+</button></div></div><button class="tap ${z.done?"done":""}" onclick="toggle(${e},${s})">${z.done?"✓":"TAP"}</button></div></div>`}).join("")+`<div class="exmenu"><button onclick="moveEx(${e},-1)">↑ Move</button><button onclick="moveEx(${e},1)">↓ Move</button>${e>=BASE[active].ex.length?`<button onclick="deleteEx(${e})">Delete</button>`:""}<button onclick="openLibrary()">Swap / Add</button></div></div>`}).join("")+`<button class="add" onclick="openLibrary()">＋ Exercise Library</button>${total?`<button class="finish" onclick="finishWorkout()">Finish Workout</button>`:""}`;save();renderDaily();startClock()}render();
